<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智阅云 - AI驱动的下一代阅读平台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter','Segoe UI',sans-serif; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); color:#fff; }
  .hero { text-align:center; padding:90px 20px 60px; }
  .badge { display:inline-block; padding:8px 20px; border-radius:999px; background:rgba(255,255,255,.1); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.2); font-size:14px; margin-bottom:24px; }
  h1 { font-size:48px; background:linear-gradient(90deg,#a18cd1,#fbc2eb); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:16px; }
  .sub { font-size:18px; color:rgba(255,255,255,.7); margin-bottom:36px; }
  .cta { display:inline-block; padding:16px 48px; border-radius:999px; background:linear-gradient(90deg,#667eea,#764ba2); color:#fff; font-size:16px; font-weight:bold; text-decoration:none; box-shadow:0 0 30px rgba(118,75,162,.6); }
  .cards { display:flex; gap:24px; max-width:1000px; margin:60px auto; padding:0 20px; }
  .card { flex:1; background:rgba(255,255,255,.08); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:36px 28px; text-align:center; }
  .card .ico { font-size:48px; margin-bottom:16px; }
  .card h3 { font-size:20px; margin-bottom:12px; }
  .card p { font-size:14px; color:rgba(255,255,255,.65); line-height:1.6; }
  .stats { display:flex; justify-content:center; gap:60px; padding:50px 20px; background:rgba(255,255,255,.05); }
  .stat { text-align:center; }
  .stat b { display:block; font-size:36px; color:#a18cd1; }
  .stat span { font-size:13px; color:rgba(255,255,255,.6); }
</style>
</head>
<body>
  <section class="hero">
    <div class="badge">🚀 全新 2.0 版本震撼上线</div>
    <h1>AI 驱动的下一代智能阅读平台</h1>
    <p class="sub">智能聚合 · 智能摘要 · 智能推送 · 智能一切</p>
    <a class="cta" href="#">立即免费体验</a>
  </section>
  <section class="cards">
    <div class="card"><div class="ico">🤖</div><h3>智能摘要</h3><p>利用先进的 AI 技术为您智能提炼文章精华，让阅读更高效。</p></div>
    <div class="card"><div class="ico">📊</div><h3>数据分析</h3><p>强大的数据 analytics 引擎，全方位洞察您的阅读习惯。</p></div>
    <div class="card"><div class="ico">💡</div><h3>个性推荐</h3><p>千人千面的智能推荐算法，越用越懂你。</p></div>
  </section>
  <section class="stats">
    <div class="stat"><b>100万+</b><span>注册用户</span></div>
    <div class="stat"><b>99.9%</b><span>满意度</span></div>
    <div class="stat"><b>24/7</b><span>智能服务</span></div>
  </section>
</body>
</html>
